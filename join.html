<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Join the waitlist for WrindhaOS — build a system for your study, habits, goals, and daily life.">
  <title>Join the Waitlist | WrindhaOS</title>
  <style>
    :root {
      --primary: #082F49;
      --secondary: #0EA5E9;
      --bg: #F0F9FF;
      --card: #FFFFFF;
      --accent: #CBD5E1;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --success: #10B981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text-main);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      min-height: 100vh;
    }
    body:before {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(14, 165, 233, 0.12);
      filter: blur(70px);
      top: -140px;
      right: -80px;
      pointer-events: none;
    }
    .container {
      width: min(100% - 32px, 600px);
      margin: 48px auto 64px;
      position: relative;
    }
    .header {
      color: white;
      padding: 38px 42px;
      border-radius: 24px 24px 0 0;
      background: linear-gradient(115deg, var(--primary), #0c4a6e 58%, var(--secondary));
      box-shadow: 0 18px 38px rgba(8, 47, 73, 0.2);
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .header:after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border: 28px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      right: -45px;
      top: -100px;
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: .75rem;
      font-weight: 800;
      opacity: .9;
      margin: 0 0 10px;
      color: #BAE6FD;
    }
    h1 {
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      margin: 0 0 8px;
      letter-spacing: -.03em;
    }
    .header p {
      margin: 0;
      opacity: .92;
      font-size: 1.05rem;
    }
    form {
      background: var(--card);
      padding: 34px 42px 42px;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 24px 65px rgba(8, 47, 73, 0.08);
      border: 1px solid var(--accent);
      border-top: none;
    }
    .section {
      padding: 0 0 10px;
    }
    h2 {
      font-size: 1.3rem;
      margin: 0 0 20px;
      letter-spacing: -.02em;
      color: var(--primary);
    }
    h2:before {
      content: "";
      display: inline-block;
      width: 5px;
      height: 20px;
      border-radius: 4px;
      background: var(--secondary);
      margin-right: 10px;
      vertical-align: -2px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 18px 0;
    }
    label {
      color: var(--text-main);
      font-size: .9rem;
      font-weight: 600;
    }
    label span {
      color: var(--text-muted);
      font-weight: 400;
    }
    input[type=text], input[type=email], input[type=tel] {
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 13px 14px;
      font: inherit;
      color: var(--text-main);
      outline: none;
      transition: .2s;
      background: #f8fafc;
    }
    input[type=text]:focus, input[type=email]:focus, input[type=tel]:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.18);
      background: #fff;
    }
    button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      color: #fff;
      background: linear-gradient(100deg, var(--primary), var(--secondary));
      font: 700 1.05rem inherit;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(8, 47, 73, 0.2);
      transition: .2s;
      margin-top: 24px;
    }
    button:hover {
      transform: translateY(-2px);
      background: linear-gradient(100deg, #0c4a6e, #0284c7);
      box-shadow: 0 12px 22px rgba(14, 165, 233, 0.35);
    }
    #formMessage {
      margin-top: 18px;
      font-size: 0.95rem;
      text-align: center;
      color: var(--success);
      font-weight: 600;
    }
    .back-home {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .back-home:hover {
      color: var(--primary);
      text-decoration: underline;
    }
    @media (max-width:650px) {
      .container { width: min(100% - 24px, 600px); margin: 24px auto 40px; }
      .header, form { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <p class="eyebrow">WrindhaOS • Early Access</p>
      <h1>Join the Waitlist</h1>
      <p>Be the first to build a system for your daily progress</p>
    </div>

    <form id="waitlist">
      <div class="section">
        <h2>Your Information</h2>

        <div class="input-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name" required>
        </div>

        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email address" required>
        </div>

        <div class="input-group">
          <label for="phone">Phone Number <span>(Optional)</span></label>
          <input type="tel" id="phone" placeholder="Enter your phone number">
        </div>
        
        <button type="submit" id="submitBtn">Join the waitlist</button>

        <div id="formMessage"></div>
        <a href="index.html" class="back-home">← Back to WrindhaOS Home</a>
      </div>
    </form>
  </div>
            <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://vdrwrnxfznvchrbnbbqt.supabase.co";
  const SUPABASE_KEY = "sb_publishable_typypoLeO7d4GgFp3zyshg_-R7kap8r";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
  const form = document.getElementById("waitlist");
  const submitBtn = document.getElementById("submitBtn");
  const formMessage = document.getElementById("formMessage");

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();

    // Basic validation
    if (!name || !email || !phone) {
      formMessage.textContent = "Please fill in all required fields.";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";

    const { error } = await supabaseClient
      .from("join_details")
      .insert({
        name: name,
        email: email,
        phone: phone || null
      });

    if (error) {
      console.error("Supabase error:", error);

      formMessage.textContent = "Something went wrong. Please try again.";

      submitBtn.disabled = false;
      submitBtn.textContent = "Get Started";

      return;
    }

    // Success
    formMessage.textContent =
      "Thank you! Your details have been submitted.";

    form.reset();

    submitBtn.disabled = false;
    submitBtn.textContent = "Get Started";
  });

</script>
